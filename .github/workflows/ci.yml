name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint · typecheck · testes)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymapp
          POSTGRES_PASSWORD: gymapp
          POSTGRES_DB: gymapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymapp -d gymapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gymapp:gymapp@localhost:5432/gymapp
      JWT_SECRET: ci-secret-nao-use-em-producao-32-caracteres
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck (shared, db, api)
        run: |
          bun run --cwd packages/shared typecheck
          bun run --cwd packages/db typecheck
          bun run --cwd apps/api typecheck

      - name: Lint
        run: |
          bun run --cwd packages/shared lint
          bun run --cwd apps/api lint

      - name: Migrations + seed
        run: |
          bun run --cwd packages/db migrate
          bun run --cwd packages/db seed

      - name: Testes (bun test)
        run: bun run --cwd apps/api test

  mobile:
    name: App (typecheck · testes)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck do app
        run: bun run --cwd apps/mobile typecheck

      - name: Testes do app (jest-expo)
        run: bun run --cwd apps/mobile test
